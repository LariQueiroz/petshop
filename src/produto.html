<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-white text-black p-6">

<h1 class="text-2xl font-bold text-green-700 mb-4">Detalhes do Produto</h1>

<div id="produto" class="border p-6 rounded shadow"></div>

<script>
const api = "http://localhost:8080/api/produtos";

// pegar ID da URL
const params = new URLSearchParams(window.location.search);
const produtoId = params.get("id");

async function carregarProduto() {
  const res = await fetch(`${api}/${produtoId}`);
  const p = await res.json();

  const div = document.getElementById("produto");

  div.innerHTML = `
    <h2 class="text-xl font-bold mb-2">${p.nome}</h2>

    <p class="mb-2"><strong>Descrição:</strong> ${p.descricao || "Sem descrição"}</p>

    <p class="mb-2"><strong>Preço:</strong> R$ ${p.preco}</p>

    <p class="mb-2">
      <strong>Estoque:</strong> 
      ${p.quantidade > 0 
        ? `<span class="text-green-600">${p.quantidade} disponíveis</span>` 
        : `<span class="text-red-600">Indisponível</span>`}
    </p>

    <button class="bg-black text-white px-4 py-2 rounded mt-4">
      Comprar
    </button>
  `;
}

carregarProduto();
</script>

</body>
</html>
